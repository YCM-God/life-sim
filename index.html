<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14151a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>人生模拟器</title>
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh; background: #14151a; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    /* 舞台：保持 16:9，同时适配竖屏与横屏（含刘海屏安全区） */
    #stage {
      position: relative;
      width: min(1280px, 96vw, 177.78vh);
      aspect-ratio: 16 / 9;
      touch-action: none;
    }
    #game {
      display: block; width: 100%; height: 100%;
      image-rendering: pixelated; background: #000;
      touch-action: none;
    }
    #touch-ui { position: absolute; inset: 0; display: none; pointer-events: none; }
    #touch-ui.on { display: block; }
    .tbtn {
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(240, 200, 120, .38);
      border-radius: 12px;
      background: rgba(18, 22, 32, .40);
      color: rgba(242, 230, 200, .92);
      font: 700 clamp(11px, 1.9vmin, 22px)/1 system-ui, "Microsoft YaHei", sans-serif;
      padding: 0; margin: 0;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .04s ease-out;
    }
    /* 按住反馈：真机上必须看得见，否则玩家不知道点没点上 */
    .tbtn:active, .tbtn.down {
      background: rgba(240, 200, 120, .40);
      border-color: rgba(255, 220, 150, .95);
      transform: scale(.95);
    }
    /* 左下方向键：3×3 网格，只占上下左右四格；没进入游戏时不显示 */
    .dpad {
      position: absolute; left: 2%; bottom: 2.5%;
      width: 26%; aspect-ratio: 1;
      display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 3%;
    }
    #touch-ui.playing .dpad { display: grid; }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }
    /* 右下功能键：2 行 × 4 列；右侧留出 17% 给属性面板，避免压住金钱/心情那几行 */
    .actions {
      position: absolute; right: 17%; bottom: 2.5%;
      width: 34%;
      display: none; grid-template-columns: repeat(4, 1fr); gap: 2.2%;
    }
    #touch-ui.playing .actions { display: grid; }
    .actions .act { aspect-ratio: 1.28; }
    .actions .accent {
      border-color: rgba(255, 209, 102, .85);
      background: rgba(58, 44, 16, .48);
      color: #ffd166;
    }
    /* 竖屏时整屏提示旋转，横屏才算进入游戏 */
    .rotate-mask {
      position: fixed; inset: 0; z-index: 50;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(10, 12, 18, .94); color: #f0c878;
      font: 700 clamp(15px, 3.6vmin, 26px)/1.6 system-ui, "Microsoft YaHei", sans-serif;
      text-align: center; pointer-events: auto;
    }
    .rotate-mask .icon { font-size: clamp(34px, 9vmin, 64px); }
    @media (orientation: portrait) { .rotate-mask { display: flex; } }
  </style>
  <script type="module" crossorigin src="./assets/index-wYzVEqy7.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="touch-ui"></div>
  </div>
</body>
</html>
