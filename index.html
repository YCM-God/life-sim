<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14151a" />
  <title>人生模拟器</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #14151a; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    /* 舞台：保持 16:9，同时适配竖屏与横屏（含刘海屏安全区） */
    #stage {
      position: relative;
      width: min(1280px, 96vw, 177.78vh);
      aspect-ratio: 16 / 9;
      touch-action: none;
    }
    #game {
      display: block; width: 100%; height: 100%;
      image-rendering: pixelated; background: #000;
      touch-action: none;
    }
    #touch-ui { position: absolute; inset: 0; display: none; pointer-events: none; }
    #touch-ui.on { display: block; }
    .tbtn {
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(240, 200, 120, .38);
      border-radius: 12px;
      background: rgba(18, 22, 32, .32);
      color: rgba(242, 230, 200, .92);
      font: 700 clamp(11px, 1.9vmin, 22px)/1 system-ui, "Microsoft YaHei", sans-serif;
      padding: 0;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn:active {
      background: rgba(240, 200, 120, .35);
      border-color: rgba(255, 220, 150, .9);
    }
    .dpad {
      position: absolute; left: 2%; bottom: 2.5%;
      width: 23%; aspect-ratio: 1;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 3%;
    }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }
    .actions {
      position: absolute; right: 2%; bottom: 2.5%;
      width: 30%;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5%;
    }
    .actions .small { aspect-ratio: 1.3; }
    .actions .wide { aspect-ratio: 1.3; }
    .actions .big {
      grid-column: span 3;
      aspect-ratio: 4.6;
      font-size: clamp(13px, 2.4vmin, 27px);
    }
    /* 竖屏时整屏提示旋转，横屏才算进入游戏 */
    .rotate-mask {
      position: fixed; inset: 0; z-index: 50;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(10, 12, 18, .94); color: #f0c878;
      font: 700 clamp(15px, 3.6vmin, 26px)/1.6 system-ui, "Microsoft YaHei", sans-serif;
      text-align: center; pointer-events: auto;
    }
    .rotate-mask .icon { font-size: clamp(34px, 9vmin, 64px); }
    @media (orientation: portrait) { .rotate-mask { display: flex; } }
  </style>
  <script type="module" crossorigin src="./assets/index-BkEQwthB.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="touch-ui"></div>
  </div>
</body>
</html>
