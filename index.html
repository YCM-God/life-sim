<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14151a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>人生模拟器</title>
  <meta name="description" content="像素风人生模拟网页游戏：上学、打工、生病、成家，把一辈子过成一场像素游戏。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="人生模拟器" />
  <meta property="og:description" content="像素风人生模拟网页游戏：上学、打工、生病、成家，把一辈子过成一场像素游戏。" />
  <meta property="og:image" content="https://ycm-god.github.io/life-sim/og.jpg" />
  <meta property="og:url" content="https://ycm-god.github.io/life-sim/" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh; background: #14151a; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    /* 舞台：保持 16:9，同时适配竖屏与横屏（含刘海屏安全区） */
    #stage {
      position: relative;
      width: min(1280px, 96vw, 177.78vh);
      aspect-ratio: 16 / 9;
      touch-action: none;
    }
    #game {
      display: block; width: 100%; height: 100%;
      image-rendering: pixelated; background: #000;
      touch-action: none;
    }
    #touch-ui { position: absolute; inset: 0; display: none; pointer-events: none; }
    #touch-ui.on { display: block; }
    .tbtn {
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(240, 200, 120, .38);
      border-radius: 12px;
      background: rgba(18, 22, 32, .40);
      color: rgba(242, 230, 200, .92);
      font: 700 clamp(11px, 1.9vmin, 22px)/1 system-ui, "Microsoft YaHei", sans-serif;
      padding: 0; margin: 0;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .04s ease-out;
    }
    /* 按住反馈：真机上必须看得见，否则玩家不知道点没点上 */
    .tbtn:active, .tbtn.down {
      background: rgba(240, 200, 120, .40);
      border-color: rgba(255, 220, 150, .95);
      transform: scale(.95);
    }
    /* 左下方向键：3×3 网格，只占上下左右四格；没进入游戏时不显示 */
    .dpad {
      position: absolute; left: 2%; bottom: 2.5%;
      width: 26%; aspect-ratio: 1;
      display: none; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 3%;
    }
    #touch-ui.playing .dpad { display: grid; }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }
    /* 右下功能键：2 行 × 4 列；右侧留出 17% 给属性面板，避免压住金钱/心情那几行 */
    .actions {
      position: absolute; right: 17%; bottom: 2.5%;
      width: 34%;
      display: none; grid-template-columns: repeat(4, 1fr); gap: 2.2%;
    }
    #touch-ui.playing .actions { display: grid; }
    .actions .act { aspect-ratio: 1.28; }
    .actions .accent {
      border-color: rgba(255, 209, 102, .85);
      background: rgba(58, 44, 16, .48);
      color: #ffd166;
    }
    /* 竖屏提示：只做建议，不再挡路。
       之前是全屏遮罩，手机开了"方向锁定"或者用的是固定竖屏的内置浏览器时，
       orientation 永远不变成 landscape，遮罩就永远关不掉，玩家根本进不了游戏。 */
    #rotate-hint {
      position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 60;
      display: none; align-items: center; gap: 8px;
      max-width: 94vw; box-sizing: border-box;
      padding: 8px 10px 8px 14px;
      border-radius: 10px;
      background: rgba(12, 15, 22, .92);
      border: 1px solid rgba(240, 200, 120, .45);
      color: #f0c878;
      font: 700 clamp(11px, 2.6vw, 15px)/1.35 system-ui, "Microsoft YaHei", sans-serif;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
      pointer-events: auto;
    }
    @media (orientation: portrait) { #rotate-hint { display: flex; } }
    #rotate-hint.closed { display: none !important; }
    #rotate-hint .rh-btn {
      pointer-events: auto;
      border: 1px solid rgba(240, 200, 120, .6);
      border-radius: 8px;
      background: rgba(240, 200, 120, .16);
      color: #ffd166;
      font: inherit;
      padding: 4px 9px;
      cursor: pointer;
    }
    #rotate-hint .rh-close {
      border: 0; background: transparent; color: rgba(240, 230, 200, .8);
      font: 700 16px/1 system-ui, sans-serif; padding: 2px 4px; cursor: pointer;
    }

    /* ===== 玫瑰花园 · 存档入口（主页面左上角） ===== */
    #rose-entry {
      position: absolute; left: 16px; top: 16px; bottom: auto;
      z-index: 65;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px 8px 10px;
      border: 2px solid rgba(240, 200, 120, .5);
      border-radius: 999px;
      background: rgba(14, 17, 24, .72);
      color: #f2e6c8;
      font: 700 clamp(11px, 1.6vmin, 16px)/1 system-ui, "Microsoft YaHei", sans-serif;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s ease-out, transform .15s ease-out;
    }
    #rose-entry:hover { border-color: rgba(255, 220, 150, .95); transform: translateY(-2px); }
    #rose-entry .re-rose { width: 30px; height: 30px; flex: none; }
    /* 进游戏后仍在左上方，下移到区域名/课程条（16,16 起 300×64）之下，收成小花 */
    #stage.playing #rose-entry { left: 16px; top: 92px; padding: 6px; gap: 0; }
    #stage.playing #rose-entry .re-label { display: none; }

    /* ===== 纯 CSS 玫瑰：花蕾 → 绽开 ===== */
    .rose { position: relative; display: inline-block; width: 100%; height: 100%; }
    .rose i { position: absolute; display: block; }
    .rose .stem { left: 47%; top: 50%; width: 7%; height: 48%; background: linear-gradient(#4a8a38, #2e5c24); border-radius: 45%; transform: rotate(6deg); }
    .rose .leaf { top: 66%; width: 36%; height: 14%; background: #3f7d2f; border-radius: 2% 70% 2% 70%; opacity: .92; }
    .rose .leaf.l { left: -1%; transform: rotate(-24deg); }
    .rose .leaf.r { right: -1%; transform: rotate(204deg) scaleY(-1); }
    .rose .ring { left: 10%; top: 2%; width: 80%; height: 64%; }
    .rose .petal {
      left: 50%; top: 100%; width: 52%; height: 88%;
      transform-origin: 50% 100%;
      border-radius: 52% 52% 44% 44% / 72% 72% 26% 26%;
      background: radial-gradient(ellipse at 50% 90%, #c01743 0%, #8e1030 60%, #630a22 100%);
      transform: translate(-50%, -100%) rotate(calc(var(--a) * .14)) scale(.72);
      transition: transform .9s cubic-bezier(.22, .9, .32, 1.08) var(--d, 0ms);
      z-index: 1;
    }
    .rose .petal.inner {
      width: 34%; height: 62%;
      background: radial-gradient(ellipse at 50% 88%, #e03564 0%, #b0173f 60%, #7c0f2a 100%);
      z-index: 2;
    }
    .rose .core {
      left: 50%; top: 60%; width: 26%; height: 26%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #f26a8f, #8e1030 70%);
      box-shadow: 0 0 0 2px rgba(255, 209, 102, .25);
      z-index: 3;
    }
    .rose.bud .petal { background: linear-gradient(#5f7057, #41503e); }
    .rose.bud .core { background: radial-gradient(circle at 40% 35%, #7c8a72, #41503e 70%); box-shadow: none; }
    .rose.bud .stem, .rose.bud .leaf { opacity: .5; filter: grayscale(.4); }
    .rose.bloom .petal { transform: translate(-50%, -100%) rotate(var(--a)) scale(1); }
    #rose-entry:hover .rose .petal { transform: translate(-50%, -100%) rotate(var(--a)) scale(1); }

    /* ===== 期末考试预约按钮：正在翻开的书本 ===== */
    #exam-book {
      position: absolute; left: 16px; top: 130px; bottom: auto;
      z-index: 65;
      display: none;
      flex-direction: column; align-items: center; gap: 2px;
      width: 48px; box-sizing: border-box;
      padding: 6px 4px;
      border: 2px solid rgba(240, 200, 120, .5);
      border-radius: 12px;
      background: rgba(14, 17, 24, .72);
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s ease-out, background .15s ease-out, opacity .15s ease-out;
    }
    #exam-book.on { display: flex; }
    #exam-book:hover { border-color: rgba(255, 220, 150, .95); }
    #exam-book.scheduled { border-color: #ffd166; background: rgba(46, 36, 14, .72); }
    #exam-book.done { opacity: .5; border-color: rgba(240, 200, 120, .25); }
    .exam-book-icon { position: relative; width: 30px; height: 22px; perspective: 130px; }
    .exam-book-icon .bk {
      position: absolute; top: 0; left: 0; width: 50%; height: 100%;
      background: #5d4a2e; border-radius: 3px 0 0 3px;
    }
    .exam-book-icon .bk.r { left: 50%; border-radius: 0 3px 3px 0; background: #6b5637; }
    .exam-book-icon .page {
      position: absolute; top: 1px; left: 50%; width: 50%; height: calc(100% - 2px);
      background: #f2ead2; border-radius: 0 2px 2px 0;
      transform-origin: left center;
      transform: rotateY(-70deg); /* 默认微微翻开，示意可点击 */
      box-shadow: -2px 0 3px rgba(0, 0, 0, .3);
    }
    #exam-book.scheduled .exam-book-icon .page {
      animation: exam-book-flip 2.4s ease-in-out infinite;
    }
    #exam-book.done .exam-book-icon .page { transform: rotateY(0deg); }
    @keyframes exam-book-flip {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(-180deg); }
    }
    .exam-book-label { font: 700 11px/1 system-ui, "Microsoft YaHei", sans-serif; color: #f2e6c8; }
    #exam-book.scheduled .exam-book-label { color: #ffd166; }
    #exam-book.done .exam-book-label { color: #8a8f98; }

    /* ===== 存档面板 ===== */
    #save-ui { position: absolute; inset: 0; z-index: 70; display: none; }
    #save-ui.on { display: block; }
    .sv-backdrop { position: absolute; inset: 0; background: rgba(6, 8, 12, .72); backdrop-filter: blur(3px); }
    .sv-card {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(92%, 780px); max-height: 88%;
      display: flex; flex-direction: column;
      box-sizing: border-box;
      border: 2px solid rgba(240, 200, 120, .45);
      border-radius: 14px;
      background: rgba(16, 19, 27, .96);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      overflow: hidden;
    }
    .sv-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid rgba(240, 200, 120, .22); }
    .sv-head-rose { width: 64px; height: 64px; flex: none; }
    .sv-head-txt { flex: 1; min-width: 0; }
    .sv-head-txt h2 { margin: 0; font: 700 20px/1.3 system-ui, "Microsoft YaHei", sans-serif; color: #ffd166; letter-spacing: 2px; }
    .sv-head-txt p { margin: 3px 0 0; font: 400 12px/1.4 system-ui, "Microsoft YaHei", sans-serif; color: #8a8f98; }
    .sv-close {
      border: 1px solid rgba(240, 200, 120, .5); background: transparent; color: #f2e6c8;
      font: 700 18px/1 system-ui, sans-serif; width: 30px; height: 30px; border-radius: 8px;
      cursor: pointer; flex: none; padding: 0;
    }
    .sv-close:hover { background: rgba(240, 200, 120, .15); }
    .sv-status { display: none; padding: 10px 18px 0; font: 600 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: #7fd18a; }
    .sv-status.show { display: block; }
    .sv-grid {
      flex: 1; overflow-y: auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 14px 18px;
      box-sizing: border-box;
    }
    .sv-loading { grid-column: 1 / -1; text-align: center; color: #8a8f98; font: 400 14px/2 system-ui, sans-serif; }
    .slot {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(240, 200, 120, .18);
      border-radius: 10px;
      background: rgba(24, 28, 40, .6);
      min-width: 0;
    }
    .slot.occupied { border-color: rgba(228, 90, 120, .4); background: rgba(46, 22, 32, .45); }
    .slot.corrupt { border-color: rgba(120, 120, 130, .3); opacity: .8; }
    .sl-rose { width: 40px; height: 40px; flex: none; }
    .sl-info { flex: 1; min-width: 0; }
    .sl-info b {
      display: block; font: 700 13px/1.4 system-ui, "Microsoft YaHei", sans-serif; color: #f2e6c8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sl-info span {
      display: block; font: 400 11px/1.4 system-ui, "Microsoft YaHei", sans-serif; color: #8a8f98;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slot.empty .sl-info b { color: #9aa67e; }
    .sl-acts { display: flex; flex-direction: column; gap: 4px; flex: none; }
    .sbtn {
      border: 1px solid rgba(240, 200, 120, .5);
      border-radius: 7px;
      background: rgba(240, 200, 120, .12);
      color: #ffd166;
      font: 700 12px/1 system-ui, "Microsoft YaHei", sans-serif;
      padding: 5px 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sbtn:hover { background: rgba(240, 200, 120, .25); }
    .sbtn.primary { border-color: rgba(127, 209, 138, .6); background: rgba(127, 209, 138, .12); color: #7fd18a; }
    .sbtn.primary:hover { background: rgba(127, 209, 138, .25); }
    .sbtn.danger { border-color: rgba(232, 106, 90, .5); background: rgba(232, 106, 90, .1); color: #e89a8a; }
    .sbtn.danger:hover, .sbtn.armed { background: rgba(232, 106, 90, .3); color: #ffd6c8; }
    .sv-save { padding: 8px 16px; font-size: 13px; flex: none; }
    .sv-foot { padding: 10px 18px 12px; border-top: 1px solid rgba(240, 200, 120, .18); font: 400 11px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: #6a7078; }
    @media (max-width: 640px) { .sv-grid { grid-template-columns: 1fr; } }

    /* ===== 开场界面：封面图 + 标题 + 开始按钮 ===== */
    #title-screen {
      position: fixed; inset: 0; z-index: 90;
      overflow: hidden;
      transition: opacity .6s ease-out;
    }
    #title-screen.gone { opacity: 0; pointer-events: none; }
    .ts-bg {
      position: absolute; inset: 0;
      background: #14151a url('cover.jpg') center 45% / cover no-repeat;
      image-rendering: pixelated;
    }
    .ts-veil {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(6, 8, 14, 0) 0%, rgba(6, 8, 14, .14) 30%, rgba(6, 8, 14, .84) 58%, rgba(6, 8, 14, .98) 100%),
        radial-gradient(115% 80% at 50% 8%, rgba(6, 8, 14, .42) 0%, rgba(6, 8, 14, 0) 58%);
    }
    .ts-body {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 6% max(5%, 18px);
      text-align: center;
    }
    .ts-tag {
      font: 700 clamp(9px, 1.35vmin, 14px)/1 system-ui, "Microsoft YaHei", sans-serif;
      letter-spacing: .42em; text-indent: .42em;
      color: rgba(240, 200, 120, .82);
      margin-bottom: clamp(8px, 1.4vmin, 16px);
      text-shadow: 0 2px 6px rgba(0, 0, 0, .7);
    }
    .ts-title {
      margin: 0;
      font: 800 clamp(30px, 6.4vmin, 78px)/1.12 system-ui, "Microsoft YaHei", sans-serif;
      letter-spacing: .14em; text-indent: .14em;
      color: #f7ecd2;
      text-shadow: 0 2px 0 #7a5a20, 0 4px 0 #4a3413, 0 10px 26px rgba(0, 0, 0, .72);
    }
    .ts-sub {
      margin: clamp(8px, 1.6vmin, 18px) 0 clamp(14px, 2.6vmin, 30px);
      font: 400 clamp(10px, 1.6vmin, 17px)/1.6 system-ui, "Microsoft YaHei", sans-serif;
      color: rgba(226, 216, 194, .82);
      letter-spacing: .06em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    }
    .ts-start {
      border: 2px solid rgba(240, 200, 120, .85);
      border-radius: 10px;
      background: rgba(20, 17, 10, .55);
      color: #ffd166;
      font: 700 clamp(13px, 2vmin, 21px)/1 system-ui, "Microsoft YaHei", sans-serif;
      letter-spacing: .3em; text-indent: .3em;
      padding: clamp(10px, 1.7vmin, 18px) clamp(26px, 4.6vmin, 52px);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(10, 12, 18, .45), 0 8px 24px rgba(0, 0, 0, .55);
      transition: background .16s ease-out, transform .16s ease-out, border-color .16s ease-out;
      -webkit-tap-highlight-color: transparent;
    }
    .ts-start:hover, .ts-start:focus-visible {
      background: rgba(240, 200, 120, .26);
      border-color: #ffe4a6;
      transform: translateY(-2px);
      outline: none;
    }
    .ts-start:active { transform: translateY(0) scale(.98); }
    .ts-hint {
      margin-top: clamp(10px, 1.8vmin, 20px);
      font: 400 clamp(9px, 1.3vmin, 13px)/1.7 system-ui, "Microsoft YaHei", sans-serif;
      color: rgba(180, 172, 154, .72);
      letter-spacing: .04em;
    }
    @media (pointer: coarse) { .ts-hint { display: none; } }
    @media (max-height: 420px) { .ts-sub, .ts-hint { display: none; } }
  </style>
  <script type="module" crossorigin src="./assets/index-CPJkS49g.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="rose-entry" type="button" aria-label="存档花园"></button>
    <button id="exam-book" type="button" aria-label="预约期末考试" title="预约期末考试（第二天开考）">
      <span class="exam-book-icon"><i class="bk"></i><i class="bk r"></i><i class="page"></i></span>
      <span class="exam-book-label">备考</span>
    </button>
    <div id="touch-ui"></div>
    <div id="title-screen">
      <div class="ts-bg"></div>
      <div class="ts-veil"></div>
      <div class="ts-body">
        <div class="ts-tag">像素人生 · 从出生到老去</div>
        <h1 class="ts-title">人生模拟器</h1>
        <p class="ts-sub">上学、打工、生病、成家——把一辈子过成一场像素游戏</p>
        <button id="ts-start" class="ts-start" type="button">开始人生</button>
        <div class="ts-hint">空格抽天赋 · WASD 移动 · E 对话 · Tab 地图 · G 存档花园</div>
      </div>
    </div>
  </div>
</body>
</html>
